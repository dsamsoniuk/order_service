ServerRoot "/usr/local/apache2"
Listen 80

# Wymagane moduły podstawowe i do obsługi PHP-FPM
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so


ServerAdmin admin@localhost
ServerName localhost

# Przekierowanie logów na wyjście Dockera (widoczne w 'docker compose logs')
# ErrorLog /proc/self/fd/2
# CustomLog /proc/self/fd/1 combined

ErrorLog /app/var/error.log
CustomLog /app/var/custom.log combined

<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-httpd-php .php
</IfModule>

<VirtualHost *:80>
    DocumentRoot /app/public

    <Directory /app/public>
        AllowOverride None
        Require all granted

        # Reguły przepisywania adresów URL dla Symfony (Front Controller)
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Przekazywanie plików .php do kontenera 'php' na port 9000
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php_order:9000"
    </FilesMatch>
    
</VirtualHost>
